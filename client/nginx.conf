user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        listen [::]:80;

        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /images/ {
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /models/ {
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}